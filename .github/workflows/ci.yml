name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test + build module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode comes from the git commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties has an aapt2 path that only exists on the author's phone.
      - name: Drop on-device-only Gradle settings
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build module zip (with APK)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $APK"
          mkdir -p build/module
          ./module/build.sh --apk="$APK" --output="$PWD/build/module/module-debug.zip"

      - name: Check module zip
        run: ./module/check.sh build/module/module-debug.zip --require-apk

      - uses: actions/upload-artifact@v4
        with:
          name: module-debug
          path: build/module/module-debug.zip

  release:
    name: Signed release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Drop on-device-only Gradle settings
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      # Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tag must match module.prop
        run: |
          TAG="${GITHUB_REF_NAME}"
          PROP=$(sed -n 's/^version=//p' module/src/module.prop)
          [ "$TAG" = "$PROP" ] || { echo "::error::tag $TAG != module.prop version $PROP"; exit 1; }
          # update.json is what installed modules read to find updates: it must match too.
          UJ_VER=$(jq -r .version update.json)
          UJ_CODE=$(jq -r .versionCode update.json)
          PROP_CODE=$(sed -n 's/^versionCode=//p' module/src/module.prop)
          [ "$UJ_VER" = "$TAG" ] || { echo "::error::update.json version $UJ_VER != tag $TAG"; exit 1; }
          [ "$UJ_CODE" = "$PROP_CODE" ] || { echo "::error::update.json versionCode $UJ_CODE != module.prop $PROP_CODE"; exit 1; }

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the APK is signed with the release key
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "$APK (build-tools $BT)"
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -qi "Android Debug" /tmp/certs.txt; then
            echo "::error::release APK is signed with the DEBUG key"; exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Build + check module zip
        run: |
          mkdir -p build/module
          ZIP="build/module/zuanvfx01-awinic-leds-module-${GITHUB_REF_NAME}.zip"
          ./module/build.sh --apk="$APK" --output="$PWD/$ZIP"
          ./module/check.sh "$ZIP" --require-apk
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
