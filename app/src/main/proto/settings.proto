syntax = "proto3";

// INI DIA BIANG KEROKNYA: Harus murni tanpa ".proto" di akhir!
option java_package = "zuanvfx01.aw22xxx_leds";
option java_multiple_files = true;

message SavedLedSettings {
  bool hwen = 1;
  int32 effect = 2;
  int32 frq = 3;
  map<int32, int32> rgb = 4;
}

message AutomationConfig {
  bool enabled = 1;
  SavedLedSettings led = 2;
  bool use_own_values = 3;
}

message TimerSettings {
  bool enabled = 1;
  int32 start_hour = 2;
  int32 start_minute = 3;
  int32 end_hour = 4;
  int32 end_minute = 5;
  
  SavedLedSettings led = 6;
  bool use_own_values = 7;

  // Weekday bitmask, bit (Calendar.DAY_OF_WEEK - 1): Sun = 1, Mon = 2, ... Sat = 64.
  // 0 = never configured = every day (keeps existing installs working unchanged).
  int32 days_mask = 8;
}

// Per-app override for Notification LED. Only the parts flagged as used are applied.
message AppLedStyle {
  bool use_color = 1;
  int32 color = 2;     // ARGB, applied to every LED
  bool use_effect = 3;
  int32 effect = 4;
}

// Extra Notification LED options (0 / empty = old behaviour).
message NotificationExtras {
  int32 duration_s = 1;          // 0 = default (3 s)
  bool only_screen_off = 2;
  bool respect_dnd = 3;
  int32 filter_mode = 4;         // 0 = all apps, 1 = only listed apps, 2 = all except listed apps
  repeated string packages = 5;  // the list used by filter_mode
  map<string, AppLedStyle> app_styles = 6;
}

// Extra Charger LED options.
message ChargerExtras {
  bool level_colors = 1;
  int32 low_threshold = 2;   // 0 = default (20 %)
  int32 high_threshold = 3;  // 0 = default (80 %)
  int32 low_color = 4;       // ARGB, 0 = default red
  int32 high_color = 5;      // ARGB, 0 = default amber
  int32 full_color = 6;      // ARGB, 0 = default green
  bool only_screen_off = 7;
}

message MusicLedConfig {
  bool enabled = 1;
  bool use_random_effects = 2;
  bool use_own_values = 3;
  bool use_dynamic_colors = 4;
  repeated int32 enabled_effects = 5;
  int32 sensitivity = 6;
  int32 min_frequency = 7;
  int32 max_frequency = 8;
  
  // Reserved from the old MediaProjection implementation; microphone mode needs no capture token.
  reserved 9, 10;

  // Beat detection mode. 0 = AGGRESSIVE (default, the original V5-style detector, so existing
  // installs keep their behaviour), 1 = PRECISION (tempo-first), 2 = HYBRID.
  int32 beat_mode = 11;

  // How the "Enabled effects" chips are labelled. 0 = NAMES (default: "2 · Breathing"),
  // 1 = NUMBERS only ("2").
  int32 effect_label_mode = 12;
}

message Settings {
  bool completed_intro = 1;
  bool completed_tutorial = 10;

  SavedLedSettings led = 2;
  bool use_saved_settings = 3;
  bool use_own_values = 4;

  bool smart_override = 5;

  AutomationConfig notification = 6;
  AutomationConfig charger = 7;
  TimerSettings timer = 8;
  MusicLedConfig music = 9;

  // Battery saver for the UI polling loop. Default (false) keeps the 1s sysfs refresh running.
  bool polling_saver = 11;

  NotificationExtras notification_extras = 12;
  ChargerExtras charger_extras = 13;
}
